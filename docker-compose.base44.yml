services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile.base44
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - PORT=3000
    command: ["sh", "-ec", "npm install --ignore-scripts && rm -rf /tmp/baileys && git clone --branch fix --depth 1 https://github.com/BochilGaming/Baileys.git /tmp/baileys && cp -r /tmp/baileys/src /app/node_modules/@adiwajshing/baileys/ && cp /tmp/baileys/tsconfig.json /app/node_modules/@adiwajshing/baileys/ && cd /app/node_modules/@adiwajshing/baileys && tsc --skipLibCheck --noEmitOnError false || true && rm -rf /tmp/baileys && cd /app && exec node index.js --server"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: on-failure

volumes:
  node_modules:
